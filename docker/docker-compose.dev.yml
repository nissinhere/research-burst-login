services:
  postgres:
    image: postgres:18.3
    container_name: postgres
    environment:
      POSTGRES_DB: cbt_auth_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev_user -d cbt_auth_db" ]
      interval: 10s
      timeout: 10s
      retries: 10
  
  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@postgres.com
      PGADMIN_DEFAULT_PASSWORD: dev_pass
    ports:
      - "5050:80"

volumes:
  postgres-data: