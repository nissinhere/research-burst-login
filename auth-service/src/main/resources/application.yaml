spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cbt_auth_db}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:dev_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  password:
    bcrypt-strength: 10
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    ttl-seconds: 3600
